name: Publish to pub.dev

# pub.dev automated publishing accepts only tag pushes and workflow_dispatch; a
# `release` event is rejected. The tag selects the package (see
# .github/scripts/check-release-metadata.sh). workflow_dispatch is for re-running
# a publish whose tag-triggered run failed.
on:
  push:
    tags:
      - 'segment_analytics-v[0-9]+.[0-9]+.[0-9]+*'
      - 'segment_analytics_plugin_*-v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish (core, or plugins/plugin_<name>)"
        required: true
        default: "core"

permissions:
  id-token: write
  contents: read

env:
  ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}
  FLUTTER_SUPPRESS_ANALYTICS: "true"
  FLUTTER_VERSION: "3.29.2"

jobs:
  meta:
    name: Resolve package and check release metadata
    runs-on: ubuntu-latest-large
    outputs:
      package: ${{ steps.check.outputs.package }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - name: Check release metadata
        id: check
        run: .github/scripts/check-release-metadata.sh
        env:
          EVENT: ${{ github.event_name }}
          TAG: ${{ github.ref_name }}
          PACKAGE: ${{ github.event.inputs.package }}

  test:
    name: Pre-publish tests
    runs-on: ubuntu-latest-large
    needs: [meta]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          sha256: 6096f21370773093ec19240e133664c1c12eb8b5a85605a92d16ce462a18eac4

      - name: Authenticate with Artifactory
        uses: ./.github/actions/artifactory-oidc

      - name: Get dependencies
        run: flutter pub get
        working-directory: packages/${{ needs.meta.outputs.package }}

      - name: Run tests
        run: |
          if [ -d test ]; then flutter test; else echo "no test/ directory, skipping"; fi
        working-directory: packages/${{ needs.meta.outputs.package }}

  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-latest-large
    needs: [meta, test]
    environment: production

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          sha256: 6096f21370773093ec19240e133664c1c12eb8b5a85605a92d16ce462a18eac4

      - name: Publish to pub.dev (Trusted Publishing)
        run: dart pub publish --force
        working-directory: packages/${{ needs.meta.outputs.package }}

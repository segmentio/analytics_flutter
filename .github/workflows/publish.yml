name: Publish to pub.dev

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish (e.g. core, plugins/plugin_firebase)"
        required: true
        default: "core"

permissions:
  id-token: write
  contents: read

env:
  ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}
  FLUTTER_SUPPRESS_ANALYTICS: "true"
  FLUTTER_VERSION: "3.29.2"

jobs:
  test:
    name: Pre-publish tests
    runs-on: ubuntu-latest-large

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          sha256: 6096f21370773093ec19240e133664c1c12eb8b5a85605a92d16ce462a18eac4

      - name: Authenticate with Artifactory
        uses: ./.github/actions/artifactory-oidc

      - name: Get dependencies
        run: flutter pub get
        working-directory: packages/${{ github.event.inputs.package || 'core' }}

      - name: Run tests
        run: flutter test
        working-directory: packages/${{ github.event.inputs.package || 'core' }}

  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-latest-large
    needs: [test]
    environment: production

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          sha256: 6096f21370773093ec19240e133664c1c12eb8b5a85605a92d16ce462a18eac4

      - name: Publish to pub.dev (Trusted Publishing)
        run: dart pub publish --force
        working-directory: packages/${{ github.event.inputs.package || 'core' }}

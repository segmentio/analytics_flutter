name: Publish to pub.dev

# pub.dev automated publishing accepts only tag pushes and workflow_dispatch, and
# only from a tag ref: a dispatch on a branch is rejected ("this token has
# 'branch' refType"). The tag selects the package (see
# .github/scripts/check-release-metadata.sh). workflow_dispatch re-runs a release
# tag's publish: gh workflow run publish.yml --ref <tag>.
on:
  push:
    tags:
      - 'segment_analytics-v[0-9]+.[0-9]+.[0-9]+*'
      - 'segment_analytics_plugin_*-v[0-9]+.[0-9]+.[0-9]+*'
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}
  FLUTTER_SUPPRESS_ANALYTICS: "true"
  FLUTTER_VERSION: "3.38.0"

jobs:
  meta:
    name: Resolve package and check release metadata
    runs-on: ubuntu-latest-large
    outputs:
      package: ${{ steps.check.outputs.package }}

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
        with:
          fetch-depth: 0

      - name: Check release metadata
        id: check
        run: .github/scripts/check-release-metadata.sh
        env:
          REF_TYPE: ${{ github.ref_type }}
          TAG: ${{ github.ref_name }}

  test:
    name: Pre-publish tests
    runs-on: ubuntu-latest-large
    needs: [meta]

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          sha256: c9cc746283f02dbad5da2785b4837b62f7956e3135fa9af87c7dde2d2bd6c5a6

      - name: Authenticate with Artifactory
        uses: ./.github/actions/artifactory-oidc

      - name: Get dependencies
        run: flutter pub get
        working-directory: packages/${{ needs.meta.outputs.package }}

      - name: Run tests
        run: |
          if [ -d test ]; then flutter test; else echo "no test/ directory, skipping"; fi
        working-directory: packages/${{ needs.meta.outputs.package }}

  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-latest-large
    needs: [meta, test]
    environment: production
    # Without credentials `dart pub publish` waits for an interactive browser
    # login that can never complete on a runner; fail instead of hanging.
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - name: Setup Flutter
        uses: ./.github/actions/setup-flutter
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          sha256: c9cc746283f02dbad5da2785b4837b62f7956e3135fa9af87c7dde2d2bd6c5a6

      # `dart pub publish` does not request the GitHub OIDC token itself.
      # dart-lang/setup-dart does this (createPubOIDCToken), but org policy only
      # admits actions/*, so it is done here the same way.
      - name: Publish to pub.dev (Trusted Publishing)
        run: |
          PUB_TOKEN=$(curl -sSf \
            -H "Authorization: Bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=https://pub.dev" | jq -r '.value')
          if [ -z "$PUB_TOKEN" ] || [ "$PUB_TOKEN" = "null" ]; then
            echo "::error::could not obtain a GitHub OIDC token for pub.dev"
            exit 1
          fi
          echo "::add-mask::$PUB_TOKEN"
          export PUB_TOKEN
          dart pub token add https://pub.dev --env-var PUB_TOKEN
          dart pub publish --force
        working-directory: packages/${{ needs.meta.outputs.package }}

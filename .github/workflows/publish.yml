name: Publish to pub.dev

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      package:
        description: "Package to publish (e.g. core, plugins/plugin_firebase)"
        required: true
        default: "core"

permissions:
  id-token: write
  contents: read

env:
  ARTIFACTORY_URL: ${{ vars.ARTIFACTORY_URL }}

jobs:
  test:
    name: Pre-publish tests
    runs-on: ubuntu-x64

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.29.2

      - name: Authenticate with Artifactory
        uses: ./.github/actions/artifactory-oidc

      - name: Get dependencies
        run: flutter pub get
        working-directory: packages/${{ github.event.inputs.package || 'core' }}

      - name: Run tests
        run: flutter test
        working-directory: packages/${{ github.event.inputs.package || 'core' }}

  publish:
    name: Publish to pub.dev
    runs-on: ubuntu-x64
    needs: [test]
    environment: production

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2
        with:
          channel: stable
          flutter-version: 3.29.2

      - name: Publish to pub.dev (Trusted Publishing)
        run: dart pub publish --force
        working-directory: packages/${{ github.event.inputs.package || 'core' }}

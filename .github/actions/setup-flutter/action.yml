name: "Setup Flutter"
description: "Install a pinned Flutter SDK from the official release archive"

# The org Actions policy allows GitHub-owned actions/* only (no Marketplace,
# no verified creators), so third-party setup actions cannot be used here.
# There is no actions/setup-flutter, so the SDK is installed inline.

inputs:
  flutter-version:
    description: "Flutter SDK version to install from the stable channel"
    required: false
    default: "3.29.2"
  sha256:
    description: "Expected SHA-256 of the Linux SDK archive. Empty skips verification."
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Restore Flutter SDK cache
      id: flutter-cache
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.tool_cache }}/flutter
        key: flutter-${{ runner.os }}-${{ runner.arch }}-${{ inputs.flutter-version }}

    - name: Download Flutter SDK
      if: steps.flutter-cache.outputs.cache-hit != 'true'
      shell: bash
      env:
        FLUTTER_VERSION: ${{ inputs.flutter-version }}
        EXPECTED_SHA256: ${{ inputs.sha256 }}
      run: |
        set -euo pipefail

        ARCHIVE="flutter_linux_${FLUTTER_VERSION}-stable.tar.xz"
        URL="https://storage.googleapis.com/flutter_infra_release/releases/stable/linux/${ARCHIVE}"

        echo "Downloading ${URL}"
        curl -fsSL --retry 3 --retry-delay 5 -o "${RUNNER_TEMP}/${ARCHIVE}" "${URL}"

        if [ -n "${EXPECTED_SHA256}" ]; then
          echo "${EXPECTED_SHA256}  ${RUNNER_TEMP}/${ARCHIVE}" | sha256sum -c -
        else
          echo "::warning::No sha256 supplied — skipping archive integrity check"
        fi

        mkdir -p "${RUNNER_TOOL_CACHE}/flutter"
        tar -xJf "${RUNNER_TEMP}/${ARCHIVE}" -C "${RUNNER_TOOL_CACHE}/flutter" --strip-components=1
        rm -f "${RUNNER_TEMP}/${ARCHIVE}"

    - name: Add Flutter to PATH
      shell: bash
      run: |
        set -euo pipefail
        echo "${RUNNER_TOOL_CACHE}/flutter/bin" >> "${GITHUB_PATH}"
        echo "${RUNNER_TOOL_CACHE}/flutter/bin/cache/dart-sdk/bin" >> "${GITHUB_PATH}"

    - name: Verify Flutter toolchain
      shell: bash
      run: |
        set -euo pipefail
        # The SDK ships as a git checkout; the tool shells out to git against it.
        git config --global --add safe.directory "${RUNNER_TOOL_CACHE}/flutter"
        flutter --version
